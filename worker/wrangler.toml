name = "stations-signal"
main = "signal.js"
compatibility_date = "2026-08-01"

# SQLite-backed Durable Objects are the class available on the Workers
# free plan; the older key-value class is paid-only. Do not change this
# to new_classes without checking what it costs.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
