name = "stations-signal"
main = "signal.js"
compatibility_date = "2026-08-01"

# SQLite-backed Durable Objects are the class available on the Workers
# free plan; the older key-value class is paid-only. Do not change this
# to new_classes without checking what it costs.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Ledger"]

# Workers AI: 10,000 neurons a day free, and no third-party key anywhere.
[ai]
binding = "AI"
